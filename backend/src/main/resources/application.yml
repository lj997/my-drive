server:
  port: 8080

spring:
  application:
    name: my-drive
  datasource:
    url: jdbc:mysql://localhost:3306/my_drive?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: myDriveSecretKeyForJwtTokenGeneration2024
  expiration: 86400000

file:
  storage:
    path: D:/AI_Coding/parttime-job/my-drive/storage
